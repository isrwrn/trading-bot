[theme]
base = "dark"
primaryColor = "#00F0FF"
backgroundColor = "#03060C"
secondaryBackgroundColor = "#0B111C"
textColor = "#C9D4E3"
borderColor = "#1A2535"
dataframeBorderColor = "#1A2535"
dataframeHeaderBackgroundColor = "#0B111C"
linkColor = "#00F0FF"
greenColor = "#00FF9C"
redColor = "#FF2E63"
yellowColor = "#FFB020"
violetColor = "#B45CFF"
baseRadius = "none"
showWidgetBorder = true
# หัวข้อ = sans-serif (Chakra Petch) · เนื้อหา = serif (Noto Serif Thai)
font = "'Noto Serif Thai':https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;500;600;700&display=swap, serif"
headingFont = "'Chakra Petch':https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap, sans-serif"

[theme.sidebar]
backgroundColor = "#070B14"
secondaryBackgroundColor = "#0B111C"

[client]
toolbarMode = "minimal"
# ซ่อน traceback จากหน้าเว็บ (ดู log เต็มได้ใน Streamlit Cloud › Manage app)
showErrorDetails = "type"

[server]
maxUploadSize = 5

[browser]
gatherUsageStats = false
