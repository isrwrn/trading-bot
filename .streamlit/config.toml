[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0A0F1A"
secondaryBackgroundColor = "#131D2F"
textColor = "#E6EDF7"
borderColor = "#22314A"
dataframeBorderColor = "#22314A"
dataframeHeaderBackgroundColor = "#16223A"
linkColor = "#22D3EE"
greenColor = "#34D399"
redColor = "#F87171"
yellowColor = "#FBBF24"
violetColor = "#A78BFA"
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
# ตัวอักษรแนวโค้งมน: หัวข้อ = Mitr · เนื้อหา = K2D
font = "K2D:https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700&display=swap, sans-serif"
headingFont = "Mitr:https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap, sans-serif"

[theme.sidebar]
backgroundColor = "#0D1422"
secondaryBackgroundColor = "#131D2F"

[client]
toolbarMode = "minimal"
# ซ่อน traceback จากหน้าเว็บ (ดู log เต็มได้ใน Streamlit Cloud › Manage app)
showErrorDetails = "type"

[server]
maxUploadSize = 5

[browser]
gatherUsageStats = false
